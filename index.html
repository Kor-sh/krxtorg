<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>krxt</title>

<style>
  body {
    margin: 0;
    background: #f5f6f8;
    font-family: system-ui, -apple-system, BlinkMacSystemFont,
                 "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    color: #111;
    display: flex;
    justify-content: center;
    padding: 60px 20px;
  }

  .card {
    background: #fff;
    max-width: 960px;
    width: 100%;
    border-radius: 16px;
    box-shadow:
      0 10px 30px rgba(0,0,0,0.08),
      0 1px 3px rgba(0,0,0,0.05);
    padding: 32px;
  }

  .layout {
    display: grid;
    grid-template-columns: 1.2fr 0.8fr;
    gap: 32px;
    align-items: center;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 48px;
    letter-spacing: -1px;
  }

  .subtitle {
    color: #555;
    margin-bottom: 24px;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0 0 24px;
  }

  li {
    margin-bottom: 10px;
    font-size: 15px;
  }

  .carousel {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 12px;
    margin-bottom: 16px;
  }

  .carousel img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 1s ease;
  }

  .carousel img.active {
    opacity: 1;
  }

  .info {
    font-size: 14px;
    color: #333;
    line-height: 1.6;
  }

  .join-box {
    margin-top: 18px;
    text-align: center;
  }

  .join-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-radius: 6px;
    border: 1px solid #7bdc7b;
    background: #1f1f1f;
    color: #7bdc7b;
    font-weight: 600;
    text-decoration: none;
    font-size: 14px;
  }

  .join-sub {
    margin-top: 6px;
    font-size: 12px;
    color: #777;
  }

  @media (max-width: 900px) {
    .layout {
      grid-template-columns: 1fr;
    }
  }
  .join-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 20px;
  border-radius: 6px;
  border: 1px solid #ffffff;
  background: #b1b1b1;
  color: #ffffff;
  font-weight: 600;
  text-decoration: none;
  font-size: 14px;
}

.join-btn .icon {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

</style>
</head>

<body>

<div class="card">
  <div class="layout">
    <!-- 좌측 -->
    <div>
      <h1>krxt</h1>
      <div class="subtitle">Minecraft Survival Server</div>

      <ul>
        <li>2026년 새해 기념으로 만든 서버</li>
        <li>친목질 금지</li>
        <li>인벤세이브 적용</li>
        <li>PVP 금지</li>
        <li>파괴 금지</li>
      </ul>

      <div class="info">
        리셋 없는 월드.<br>
        파괴보다 기록을 남기는 서버.
      </div>
    </div>

    <!-- 우측 -->
    <div>
      <div class="carousel">
        <img src="show (1).png" class="active">
        <img src="show (2).png">
        <img src="show (3).png">
        <img src="show (4).png">
        <img src="show (5).png">
        <img src="show (6).png">
      </div>

      <div class="info">
        <b>World age:</b> <span id="worldAge">0</span> days<br>
        <b>Rules:</b> No PVP / No destruction of buildings
      </div>

<a class="join-btn" href="#">
  <svg xmlns="http://www.w3.org/2000/svg"
       class="icon"
       fill="currentColor"
       viewBox="0 0 512 512">
    <path d="M272 0H396.1c12.7 0 24.9 5.1 33.9 14.1l67.9 67.9c9 9 14.1 21.2 14.1 33.9V336c0 26.5-21.5 48-48 48H272c-26.5 0-48-21.5-48-48V48c0-26.5 21.5-48 48-48zM48 128H192v64H64V448H256V416h64v48c0 26.5-21.5 48-48 48H48c-26.5 0-48-21.5-48-48V176c0-26.5 21.5-48 48-48z"></path>
  </svg>
  KRXT
</a>
<div class="join-sub">Click to Join!</div>

    </div>
  </div>
</div>

<script>
  // 이미지 스와핑
  const imgs = document.querySelectorAll(".carousel img");
  let i = 0;
  setInterval(() => {
    imgs[i].classList.remove("active");
    i = (i + 1) % imgs.length;
    imgs[i].classList.add("active");
  }, 4000);

  // World age 계산 (2025-12-31 기준)
  const start = new Date("2025-12-31T00:00:00");
  const now = new Date();
  const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
  document.getElementById("worldAge").textContent = diff;
</script>

</body>
</html>
